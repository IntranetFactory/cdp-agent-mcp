services:
  cdp-agent-mcp:
    build: .
    container_name: cdp-agent-mcp
    # ports:
      # - "3000:3000"  # VNC HTTP
      # - "3001:3001"  # VNC HTTPS
      # - "3002:3002"  # MCP Server
      # - "9222:9222"  # Chrome CDP
    expose:
      - "3000"  # VNC HTTP
      - "3002"  # MCP Server
    volumes:
      - ./root/config:/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    environment:
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - MCP_INSECURE=true
      - BASE_URL=${BASE_URL}
      - CUSTOM_USER=${VNC_USER:-admin}
      - PASSWORD=${VNC_PASSWORD:-changeme}

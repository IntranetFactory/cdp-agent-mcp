services:
  chrome-mcp:
    build: .
    image: chrome-mcp:latest
    container_name: chrome-mcp
    # ports:
      # - "3000:3000"  # VNC HTTP
      # - "3001:3001"  # VNC HTTPS
      # - "3002:3002"  # MCP Server
      # - "9222:9222"  # Chrome CDP
    expose:
      - "3000"  # VNC HTTP
      - "3002"  # MCP Server
    volumes:
      - ./root/config:/config
    restart: unless-stopped
    environment:
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - MCP_INSECURE=true
